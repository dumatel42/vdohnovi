    font-family: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  /* ---------- Слой 0: живой фон-мандала ---------- */
  #mandala {
    position: fixed;
    inset: 0;
    display: block;
  }

  /* ---------- Сцена ---------- */
  .scene {
    position: relative;
    z-index: 1;
    height: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px 76px;
  }

  /* ---------- Слой 2: центральный пульс-круг ---------- */
  .orb {
    width: 200px;
    height: 200px;
    margin-bottom: 48px;
    opacity: 0;
    animation: softIn 2.4s ease 0.2s forwards;
  }
  .orb svg {
    width: 100%;
    height: 100%;
    display: block;
    animation: pulse 4s ease-in-out infinite;   /* в такт дыханию фона (4с) */
    filter: drop-shadow(0 0 22px rgba(155, 89, 182, 0.18));
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.08); }
  }
  @keyframes softIn { to { opacity: 1; } }

  /* ---------- Слой 3: имя (появляется посимвольно) ---------- */
  .name {
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 42px;
    line-height: 1.25;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .name .ch {
    display: inline-block;
    opacity: 0;
    animation: charIn 0.6s ease forwards;
  }
  @keyframes charIn {
    from { opacity: 0; filter: blur(5px); }
    to   { opacity: 1; filter: blur(0); }
  }

  /* ---------- Слой 4: подзаголовок ---------- */
  .subtitle {
    margin-top: 20px;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.4em;
    text-indent: 0.4em;           /* компенсация trailing letter-spacing */
    white-space: nowrap;          /* без uppercase — сохраняем акцент «новОМу» */
    color: var(--accent);
    opacity: 0;
    animation: fadeUp 1.5s ease 4s forwards;
  }

  /* ---------- Слой 5: живая цитата ---------- */
  .quote-zone {
    margin-top: 46px;
    max-width: 500px;
    min-height: 3.4em;            /* фиксируем высоту — нет скачка кнопки */
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .quote {
    font-size: 18px;
    font-weight: 300;
    font-style: italic;
    line-height: 1.7;
    color: var(--accent-light);
    opacity: 0;
    transition: opacity 1s ease;
  }
  .quote.visible { opacity: 1; }

  /* ---------- Слой 6: разделитель ---------- */
  .divider {
    margin: 38px auto 34px;
    width: 60px;
    height: 1px;
    background: rgba(155, 89, 182, 0.2);
    opacity: 0;
    animation: fadeUp 1.5s ease 5s forwards;
  }

  /* ---------- Слой 7: CTA — выбор: Telegram или VK Видео ---------- */
  .cta-row {
    display: flex;
    gap: 18px;
    justify-content: center;
  }
  .cta {
    display: inline-block;
    padding: 15px 36px 14px;
    border: 1px solid rgba(155, 89, 182, 0.55);
    border-radius: 2px;
    font-size: 11px;
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    text-transform: uppercase;
    color: var(--accent-light);
    text-decoration: none;
    background: transparent;
    transition: background 0.3s ease;
    opacity: 0;
    animation: fadeUp 1.5s ease 5s forwards;
  }
  .cta:hover { background: rgba(155, 89, 182, 0.1); }
  .cta:focus-visible { outline: 1px solid var(--accent-light); outline-offset: 4px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Слой 8: подпись ---------- */
  .foot {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 26px;
    z-index: 1;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--text);
    text-align: center;
    opacity: 0;
    animation: footIn 2s ease 5.5s forwards;
  }
  @keyframes footIn { to { opacity: 0.3; } }

  /* ---------- Адаптивность ---------- */
  @media (max-width: 600px) {
    .scene { padding: 32px 20px 64px; }
    .orb { width: 140px; height: 140px; margin-bottom: 34px; }
    .name { font-size: 28px; }
    .subtitle { font-size: 11px; letter-spacing: 0.28em; text-indent: 0.28em; }
    .quote { font-size: 16px; }
    .quote-zone { margin-top: 34px; }
    .divider { margin: 28px auto 26px; }
    .cta-row { flex-direction: column; align-items: center; gap: 14px; }
    .cta { padding: 13px 28px 12px; }
  }
  @media (max-height: 700px) {
    .orb { width: 150px; height: 150px; margin-bottom: 28px; }
    .quote-zone { margin-top: 30px; min-height: 3.2em; }
    .divider { margin: 24px auto 22px; }
    .scene { padding: 32px 24px 64px; }
  }
</style>
</head>

<script>
(function () {
  'use strict';

  /* ================= Слой 0: мандала на Canvas ================= */
  var canvas = document.getElementById('mandala');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, CX = 0, CY = 0;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2;
    CY = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  var start = performance.now();
  var ROTATION = 0.02;   /* рад/с — едва заметное вращение */
  var R0 = 80;           /* внутренний радиус колец */
  var STEP = 40;         /* шаг между кольцами */

  function draw(now) {
    var t = (now - start) / 1000; /* секунды с загрузки */
    ctx.clearRect(0, 0, W, H);

    var maxR = Math.min(W, H) * 0.48;

    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(t * ROTATION);

    /* концентрические окружности: прозрачность убывает к краям */
    var count = Math.floor((maxR - R0) / STEP);
    for (var i = 0; i <= count; i++) {
      var r = R0 + i * STEP;
      var p = count > 0 ? i / count : 0;
      var alpha = 0.10 * (1 - p) + 0.015;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(155, 89, 182, ' + alpha.toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    /* 6 радиальных линий под 60° — вращаются вместе с кольцами */
    ctx.strokeStyle = 'rgba(155, 89, 182, 0.05)';
    for (var k = 0; k < 6; k++) {
      var a = Math.PI / 3 * k;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * R0, Math.sin(a) * R0);
      ctx.lineTo(Math.cos(a) * maxR, Math.sin(a) * maxR);
      ctx.stroke();
    }
    ctx.restore();

    /* дыхание центра: цикл 4с, диапазон прозрачности 0.04 → 0.14 */
    var breath = 0.5 + 0.5 * Math.sin(t * Math.PI / 2);
    var glowAlpha = 0.04 + 0.10 * breath;
    var glowR = Math.min(W, H) * 0.35;
    var g = ctx.createRadialGradient(CX, CY, 0, CX, CY, glowR);
    g.addColorStop(0, 'rgba(155, 89, 182, ' + glowAlpha.toFixed(3) + ')');
    g.addColorStop(1, 'rgba(155, 89, 182, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ================= Слой 3: имя по буквам ================= */
  var NAME = 'Алексей Shakti Тонких';
  var nameEl = document.getElementById('name');
  var inner = document.createElement('span');
  inner.setAttribute('aria-hidden', 'true');
  var chars = NAME.split('');
  for (var c = 0; c < chars.length; c++) {
    if (chars[c] === ' ') {
      inner.appendChild(document.createTextNode(' '));
    } else {
      var s = document.createElement('span');
      s.className = 'ch';
      s.style.animationDelay = (2000 + c * 80) + 'ms';
      s.textContent = chars[c];
      inner.appendChild(s);
    }
  }
  nameEl.appendChild(inner);

  /* ================= Слой 5: живые цитаты ================= */
  var quotes = [
    "Любовь — это не чувство. Это состояние сознания.",
    "Когда сердце открыто — истина входит без стука.",
    "Вера не требует доказательств. Она сама является доказательством.",
    "В тишине между словами — самое важное.",
    "Реализованный человек не ищет смысл. Он им является.",
    "Звук — это свет, ставший доступным уху.",
    "Путь внутрь — самое дальнее путешествие.",
    "Дух не устаёт. Устаёт только ум."
  ];

  var quoteEl = document.getElementById('quote');
  var qi = 0;
  quoteEl.textContent = quotes[0];

  /* 4.5s — появление первой цитаты */
  setTimeout(function () {
    quoteEl.classList.add('visible');
  }, 4500);

  /* каждые 12s — смена: уход за 1s, приход за 1s */
  setInterval(function () {
    quoteEl.classList.remove('visible');
    setTimeout(function () {
      qi = (qi + 1) % quotes.length;
      quoteEl.textContent = quotes[qi];
      quoteEl.classList.add('visible');
    }, 1000);
  }, 12000);
})();
</script>
